
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VN Reader Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Roboto:wght@300;400;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto', 'sans-serif'],
              serif: ['Merriweather', 'serif'],
              mono: ['Fira Code', 'monospace'],
            },
            colors: {
              vn: {
                dark: '#1a1a1a',
                panel: 'rgba(0, 0, 0, 0.8)',
                accent: '#3b82f6'
              }
            }
          }
        }
      }
    </script>
    <style>
      body { margin: 0; overflow: hidden; background-color: #111; color: white; }
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #222; }
      ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #555; }

      /* Glossary Term Styling */
      .glossary-term {
        color: #60a5fa;
        text-decoration: underline dotted #3b82f6;
        text-underline-offset: 4px;
        cursor: help;
        font-weight: 600;
        transition: all 0.2s ease;
      }
      .glossary-term:hover {
        color: #93c5fd;
        text-decoration-color: #93c5fd;
        background-color: rgba(59, 130, 246, 0.1);
        border-radius: 4px;
      }
    </style>
  <script type="importmap">

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

  }
}
</script>
